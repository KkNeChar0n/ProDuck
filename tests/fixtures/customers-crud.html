<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>青禾 CRM · 客户列表</title><style>body{margin:0;background:#f7f8f4;color:#28392d;font:14px -apple-system,sans-serif}header{padding:18px 28px;background:#fff;border-bottom:1px solid #dce4d8;font-weight:600}main{margin:28px;background:#fff;border:1px solid #dce4d8;border-radius:10px;padding:28px}h1{font-size:24px;margin:0 0 8px}.muted{color:#7a8576;font-size:13px}.heading{display:flex;justify-content:space-between;align-items:center}.filters{display:flex;gap:10px;margin:26px 0}input,select,button{font:inherit;padding:10px 13px;border:1px solid #d5dece;border-radius:6px;background:white}button{cursor:pointer}.primary{background:#315543;color:white;border:0}table{border-collapse:collapse;width:100%;text-align:left}th{background:#f4f6f0;color:#727f68;font-weight:500}td,th{padding:16px;border-bottom:1px solid #e7ecdf}.badge{background:#e9efdf;padding:5px 8px;border-radius:5px;color:#5b7445;font-size:12px}dialog{border:1px solid #ddd;border-radius:12px;padding:28px;width:340px}dialog::backdrop{background:#0004}label{display:block;margin:16px 0}label input{display:block;margin-top:8px;width:90%}.actions{display:flex;justify-content:flex-end;gap:8px}#notice{color:#426a39}#empty{padding:30px;text-align:center}</style></head><body><header>青禾 CRM / 客户管理</header><main><div class="heading"><div><h1>客户列表</h1><div class="muted">管理客户信息，跟进每一次合作。</div></div><button id="add" class="primary">新增客户</button></div><form id="filters" class="filters"><input id="search" placeholder="搜索客户名称" aria-label="搜索客户名称"><select id="status" aria-label="客户状态"><option>全部状态</option><option>合作中</option><option>跟进中</option></select><button>搜索</button><button type="button" id="reset">重置</button></form><table><thead><tr><th>客户名称</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>暂无匹配客户</div><p id="notice" role="status"></p></main><dialog id="dialog"><h2>新增客户</h2><form id="customer-form"><label>客户名称<input id="name" required></label><label>负责人<input id="owner" required></label><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog><script>const customers=[{name:'青禾科技',owner:'陈晓',status:'合作中'},{name:'拾光设计',owner:'林悦',status:'跟进中'},{name:'山野生活',owner:'周舟',status:'合作中'}];let editing=-1;const q=s=>document.querySelector(s);function render(){const rows=customers.filter(c=>c.name.includes(q('#search').value)&&(q('#status').value==='全部状态'||c.status===q('#status').value));q('#rows').replaceChildren(...rows.map(c=>{const tr=document.createElement('tr');for(const text of [c.name,c.owner,c.status]){const td=document.createElement('td');td.textContent=text;tr.append(td);}const td=document.createElement('td');const button=document.createElement('button');button.textContent='编辑 '+c.name;button.onclick=()=>{editing=customers.indexOf(c);q('#dialog h2').textContent='编辑客户';q('#name').value=c.name;q('#owner').value=c.owner;q('#dialog').showModal();};td.append(button);tr.append(td);return tr;}));q('#empty').hidden=rows.length>0;}q('#filters').onsubmit=e=>{e.preventDefault();render();};q('#reset').onclick=()=>{q('#search').value='';q('#status').selectedIndex=0;render();};q('#add').onclick=()=>{editing=-1;HTMLFormElement.prototype.reset.call(q('#customer-form'));q('#dialog h2').textContent='新增客户';q('#dialog').showModal();};q('#cancel').onclick=()=>q('#dialog').close();q('#customer-form').onsubmit=e=>{e.preventDefault();if(editing<0)customers.push({name:q('#name').value,owner:q('#owner').value,status:'跟进中'});else Object.assign(customers[editing],{name:q('#name').value,owner:q('#owner').value});q('#dialog').close();q('#customer-form').reset();q('#notice').textContent=editing<0?'客户已新建':'客户已更新';render();};render();</script></body></html>
